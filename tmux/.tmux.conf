set -g default-terminal "screen-256color"
set -as terminal-overrides ',*:RGB'
# OSC52 clipboard (Ms capability; works over ssh in WezTerm)
set -as terminal-features ',*:clipboard'

set -g base-index 1
set -g pane-base-index 1

set -g escape-time 0
set -g repeat-time 1000
set -g history-limit 100000
set -s focus-events on

set -g set-titles on
set -g renumber-windows on
set -g automatic-rename off
# set -g automatic-rename-format '#{b:pane_current_path}'

set -g monitor-activity on
set -g visual-activity off
set -g exit-empty off
set -g detach-on-destroy off

# copy mode
set -g mouse on
# 'on' (not the default 'external'): panes may set the clipboard too
set -s set-clipboard on
set -g status-keys vi
setw -g mode-keys vi

# prefix
# unbind C-b
# set -g prefix C-a
# bind C-a send-prefix
# bind -n C-a send-keys C-a

bind b list-buffers
bind B choose-buffer
bind P paste-buffer

# unbind -T copy-mode-vi Enter
# bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel
# no-clear: stay in copy mode, keep selection and scroll position
unbind -T copy-mode-vi MouseDragEnd1Pane
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-no-clear
bind -T copy-mode-vi y send -X copy-selection-no-clear
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi Escape send -X cancel

# regex search up (replaces tmux-copycat); n/N jump, v select, y copy
bind / copy-mode \; command-prompt -p "(search up)" "send -X search-backward \"%%%\""

# scratchpad as a session, toggled inline -- no script: run-shell expands
# formats, `=`-prefixed targets avoid substring matches. window 1, recreated
# at position 1 when closed; session survives nvim exit
bind -n -N 'Toggle scratchpad session' M-` if-shell -F '#{==:#{session_name},scratchpad}' 'switch-client -l' 'new-session -A -s scratchpad -n nvim -c "#{HOME}/scratchpad" nvim' \; run-shell "tmux -S '#{socket_path}' list-windows -t =scratchpad -F '##{window_name}' 2>/dev/null | grep -qx nvim || tmux -S '#{socket_path}' new-window -d -b -t =scratchpad:1 -n nvim -c '#{HOME}/scratchpad' nvim"

# htop popup by prefix g
# bind g display-popup -w 90% -h 90% -E htop

# open new windows and panes in the current path
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

bind '=' setw synchronize-panes
bind C-l send-keys 'C-l'
bind Tab switch-client -l # last session
bind '`' select-window -l # last window

# pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# resize panes; M-hjkl and C-hjkl go to nvim when it is focused
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

bind -n 'M-h' if-shell "$is_vim" 'send-keys M-h' 'resize-pane -L 5'
bind -n 'M-j' if-shell "$is_vim" 'send-keys M-j' 'resize-pane -D 5'
bind -n 'M-k' if-shell "$is_vim" 'send-keys M-k' 'resize-pane -U 5'
bind -n 'M-l' if-shell "$is_vim" 'send-keys M-l' 'resize-pane -R 5'

# pane navigation with C-hjkl, seamless with nvim splits
bind -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

# move windows
bind -n M-S-Left swap-window -t -1\; select-window -t -1
bind -n M-S-Right swap-window -t +1\; select-window -t +1

# tmux config
bind r source-file ~/.tmux.conf \; display '~/.tmux.conf sourced'
bind e new-window -n "~/.tmux.conf" "\${EDITOR:-vim} ~/.tmux.conf && tmux source ~/.tmux.conf && tmux display \"~/.tmux.conf sourced\""

# colors
bg=#282828
gray_light=#a89984
gray_dark=#928374
yellow_light=#fabd2f
yellow_dark=#d79921

# status
set -g display-time 1500
set -g status-interval 60
set -g status-position top
set -g status-bg default
set -g status-style "fg=${gray_dark},bg=default"
set -g status-left " "
set -g status-right "#[fg=${gray_dark}][#S] %Y-%m-%d %H:%M"
set -g window-status-style "bg=default"
set -g window-status-current-style "fg=${gray_light},bold"
set -g window-status-last-style "bg=default"
set -g window-status-activity-style "bg=default"
set -g window-status-bell-style "bg=default"
set -g message-style "fg=${bg},bg=${yellow_dark}"
set -g mode-style "fg=${bg},bg=${yellow_dark}"
set -g pane-border-style "fg=${gray_dark},bg=default"
set -g pane-active-border-style "fg=${yellow_light},bg=default"

# plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

