# general
set -g default-terminal "screen-256color"
set -as terminal-overrides ',*:RGB'
set -as terminal-features ',*:clipboard'

set -g base-index 1
set -g pane-base-index 1

set -g escape-time 0
set -g repeat-time 1000
set -g history-limit 100000
set -s focus-events on

set -g set-titles on
set -g renumber-windows on
set -g automatic-rename on
set -g automatic-rename-format '#{b:pane_current_path}'
set -g allow-rename on

set -g monitor-activity on
set -g visual-activity off
set -g exit-empty off
set -g detach-on-destroy off

# copy mode
set -g mouse on
set -s set-clipboard on
set -g status-keys vi
setw -g mode-keys vi

# unbind -T copy-mode-vi MouseDragEnd1Pane
# unbind -T copy-mode-vi Enter
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-no-clear
bind -T copy-mode-vi y send -X copy-selection-no-clear
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi Escape send -X cancel

# scratchpad
bind -n -N 'Toggle scratchpad session' M-s \
  if-shell -F '#{==:#{session_name},scratchpad}' \
    'switch-client -l' \
    { new-session -A -s scratchpad -n scratchpad -c '#{HOME}/scratchpad'; \
      run-shell "tmux -S '#{socket_path}' new-window -d -t =scratchpad:1 -n scratchpad -c '#{HOME}/scratchpad' 2>/dev/null || :" }

# htop popup by prefix g
# bind g display-popup -w 90% -h 90% -E htop

# open new windows and panes in the current path
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

bind '=' setw synchronize-panes
bind C-l send-keys 'C-l'
bind 'Tab' switch-client -l # last session
bind '`' select-window -l # last window

# pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# move windows
bind -n M-S-Left swap-window -t -1\; select-window -t -1
bind -n M-S-Right swap-window -t +1\; select-window -t +1

# tmux config
bind r source-file ~/.tmux.conf \; display '~/.tmux.conf sourced'
bind e new-window -n "~/.tmux.conf" "\${EDITOR:-vim} ~/.tmux.conf && tmux source ~/.tmux.conf && tmux display \"~/.tmux.conf sourced\""

# reset pane terminal state
bind R send-keys -R

# colors
%hidden bg=#282828
%hidden gray_light=#a89984
%hidden gray_dark=#928374
%hidden yellow_light=#fabd2f
%hidden yellow_dark=#d79921

# status
set -g display-time 1500
set -g status-interval 5
set -g status-position top
# set -g status-bg default # redundant: status-style already sets bg=default
set -g status-style "fg=${gray_dark},bg=default"
set -g status-left " "
set -g status-right "#[fg=${yellow_light}]#{?synchronize-panes,SYNC ,}#[fg=${gray_dark}][#S] %Y-%m-%d %H:%M"
set -g status-right-length 60
set -g window-status-style "bg=default"
set -g window-status-current-style "fg=${gray_light},bold"
set -g window-status-last-style "bg=default" # same as window-status-style
# set -g window-status-activity-style "fg=${yellow_light},bold"
# set -g window-status-bell-style "fg=${bg},bg=${yellow_light},bold"
set -g message-style "fg=${bg},bg=${yellow_dark}"
set -g mode-style "fg=${bg},bg=${yellow_dark}"
set -g pane-border-style "fg=${gray_dark},bg=default"
set -g pane-active-border-style "fg=${yellow_light},bg=default"

# plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @resurrect-capture-pane-contents 'off'
set -g @continuum-restore 'on'

# init tmux plugin manager when installed
if-shell '[ -x ~/.tmux/plugins/tpm/tpm ]' 'run ~/.tmux/plugins/tpm/tpm'
